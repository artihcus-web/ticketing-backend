name: Deploy to Server

on:
  workflow_run:
    workflows: ["Build and Push Docker Image"]
    types:
      - completed
  workflow_dispatch: # Allows manual triggering

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy docker-compose.prod.yml to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          source: "backend/docker-compose.prod.yml"
          target: "/data/articket"
          strip_components: 1

      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -ex
            cd /data/articket
            
            echo "🔎 Checking current images..."
            docker images artihcus/articket-backend:latest
            
            echo "🚚 Pulling latest image..."
            docker pull artihcus/articket-backend:latest
            
            echo "� Stopping and removing old container (if exists)..."
            docker stop articket_backend || true
            docker rm articket_backend || true
            
            echo "🚀 Starting new container..."
            docker compose -f docker-compose.prod.yml up -d
            
            echo "📊 Verification:"
            docker ps | grep articket_backend
            docker inspect articket_backend --format '{{.Created}}'
            
            echo "✅ Backend deployed successfully"

