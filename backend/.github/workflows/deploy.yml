name: Deploy to Server

on:
  workflow_run:
    workflows: ["Build and Push Docker Image"]
    types:
      - completed
  workflow_dispatch: # Allows manual triggering

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy docker-compose.prod.yml to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          source: "backend/docker-compose.prod.yml"
          target: "/data/articket"
          strip_components: 1

      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -ex
            cd /data/articket
            
            echo "🔎 Verifying configuration files..."
            ls -la
            
            echo "🚚 Pulling latest image..."
            docker pull artihcus/articket-backend:latest
            
            echo "🚀 Recreating container..."
            # Using force-recreate ensures it uses the new image even if compose thinks nothing changed
            docker compose -f docker-compose.prod.yml up -d --force-recreate
            
            echo "🧹 Cleaning up old images..."
            docker image prune -f
            echo "✅ Backend deployed successfully via Docker Compose V2"

